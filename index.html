<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Industry Action</title>
<style>
  :root{
    --bg:#070b16;--ink:#eef2ff;--mut:#8a96b8;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);
    --cy:#22d3ee;--vi:#7c5cff;--gold:#fbbf24;--ok:#34d399;--bad:#fb7185;
    --g1:linear-gradient(135deg,#22d3ee,#7c5cff);--g2:linear-gradient(135deg,#fbbf24,#f97316);--g3:linear-gradient(135deg,#34d399,#10b981);--g4:linear-gradient(135deg,#fb7185,#e11d48);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{height:100%;margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.1px}
  body{background:radial-gradient(900px 500px at 10% -10%,#1b2a66 0,transparent 60%),radial-gradient(700px 500px at 100% 10%,#3b1d6e 0,transparent 55%),var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.25;mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%);pointer-events:none}
  .num{font-variant-numeric:tabular-nums}
  /* HUD */
  header{flex:0 0 auto;position:relative;z-index:5;padding:max(10px,env(safe-area-inset-top)) 14px 6px}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .logo{font-weight:800;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:600;letter-spacing:1px;margin-left:6px}
  .hud{display:flex;gap:8px;align-items:stretch}
  .pill{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pill svg{flex:0 0 auto}
  .pill b{font-size:17px;font-weight:800}
  .pill span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .ring{position:relative;width:44px;height:44px;flex:0 0 44px}
  .ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
  .iconbtn{width:44px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:18px;backdrop-filter:blur(14px)}
  /* main */
  main{flex:1;overflow-y:auto;padding:6px 14px 100px;position:relative;z-index:1;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .screen{display:none}.screen.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  h2{margin:8px 2px 2px;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--mut);font-size:13px;margin:0 2px 8px}
  /* cards */
  .card{--c:#7c5cff;position:relative;display:flex;align-items:center;gap:12px;padding:12px;margin:10px 0;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),var(--glass) 60%);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;box-shadow:0 8px 24px -12px #000}
  .card::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .card .i{flex:1;min-width:0;font-size:15px;font-weight:700}
  .card small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:3px;line-height:1.35}
  .art{width:58px;height:58px;flex:0 0 58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 70%);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .art svg{filter:drop-shadow(0 4px 6px #0008)}
  /* buttons */
  .btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14px;color:#07101f;background:var(--g3);box-shadow:0 6px 18px -6px rgba(52,211,153,.7),inset 0 1px 0 #fff6;transition:transform .12s,filter .2s;cursor:pointer}
  .btn:active{transform:scale(.94);filter:brightness(1.15)}
  .btn.b{background:var(--g1);color:#fff;box-shadow:0 6px 18px -6px rgba(124,92,255,.8),inset 0 1px 0 #fff5}
  .btn.a{background:var(--g2);box-shadow:0 6px 18px -6px rgba(249,115,22,.8),inset 0 1px 0 #fff6}
  .btn.r{background:var(--g4);color:#fff;box-shadow:0 6px 18px -6px rgba(225,29,72,.8),inset 0 1px 0 #fff5}
  .btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
  .btn:disabled{background:rgba(255,255,255,.07);color:#6b7692;box-shadow:none;cursor:default}
  .btn.big{width:100%;padding:18px;font-size:19px;border-radius:18px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--glass2)}
  .up{color:var(--ok)}.dn{color:var(--bad)}
  .meter{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;border-radius:6px;background:var(--g1);transition:width .4s}
  .pips{display:flex;gap:3px;margin-top:6px}.pips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.pips i.on{background:var(--g2)}
  /* nav */
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:532px;z-index:20;display:flex;padding:6px;border-radius:24px;background:rgba(14,20,40,.72);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 40px -10px #000}
  nav button{flex:1;position:relative;background:none;border:0;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;transition:color .2s}
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:#fff;background:var(--g1);box-shadow:0 6px 18px -6px rgba(124,92,255,.9)}
  /* overlay */
  #ov{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
  #ovbox{position:relative;width:100%;max-width:420px;max-height:96vh;overflow-y:auto;padding:18px;border-radius:26px;background:linear-gradient(160deg,rgba(32,42,82,.96),rgba(14,20,40,.97));border:1px solid var(--line);box-shadow:0 30px 80px -10px #000,0 0 0 1px #ffffff08 inset;animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  #ovbox h3{margin:0 0 2px;font-size:20px;font-weight:800;padding-right:40px}
  #ovbox .sub{padding-right:40px}
  .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:14px}
  .msg{min-height:30px;text-align:center;font-weight:800;font-size:18px;margin:8px 0}
  .msg.pop{animation:msg .35s}@keyframes msg{from{transform:scale(1.5);opacity:.3}to{transform:none;opacity:1}}
  .dots{display:flex;justify-content:center;gap:7px;margin:4px 0 8px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14)}
  .dots i.p{background:var(--gold);box-shadow:0 0 10px var(--gold)}.dots i.g{background:var(--ok);box-shadow:0 0 10px var(--ok)}.dots i.m{background:var(--bad)}
  .track{position:relative;height:44px;border-radius:22px;background:linear-gradient(90deg,#0b1226,#131c3a);border:1px solid var(--line);overflow:hidden;margin:14px 0;box-shadow:inset 0 2px 8px #0008}
  .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#34d39922,#34d39988,#34d39922);box-shadow:0 0 18px #34d399aa}
  .zone::after{content:"";position:absolute;left:37.5%;right:37.5%;top:0;bottom:0;background:#fbbf2466}
  .mark{position:absolute;top:3px;bottom:3px;width:8px;margin-left:-4px;border-radius:5px;background:#fff;box-shadow:0 0 14px 3px #fff}
  .heat{background:linear-gradient(90deg,#38bdf8,#22d3ee 25%,#fbbf24 60%,#f97316 80%,#ef4444)}
  .heat .zone{background:#ffffff22;border-left:2px solid #34d399;border-right:2px solid #34d399;box-shadow:0 0 18px #34d399}
  .heat .zone::after{display:none}
  .timer{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.timer i{display:block;height:100%;background:var(--g2)}
  .tapbtn{position:relative;width:100%;height:170px;border:0;border-radius:28px;background:var(--g2);color:#2a1300;font-size:30px;font-weight:900;box-shadow:0 14px 30px -10px rgba(249,115,22,.9),inset 0 2px 0 #fff7,inset 0 -8px 0 #0002;transition:transform .06s}
  .tapbtn:active{transform:scale(.95)}
  .pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .pad{height:96px;border:0;border-radius:22px;opacity:.38;transition:opacity .1s,transform .1s,box-shadow .1s;box-shadow:inset 0 3px 0 #fff5}
  .pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 32px 4px var(--pc),inset 0 3px 0 #fff8}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:var(--glass2);color:var(--ink);font-size:18px;font-weight:800}
  .step b{min-width:26px;text-align:center;font-size:16px}
  canvas{display:block;width:100%;max-width:340px;aspect-ratio:320/440;margin:6px auto;border-radius:20px;touch-action:none;box-shadow:0 12px 30px -10px #000}
  .ctrl{display:flex;gap:10px}.ctrl .btn{flex:1;font-size:22px;padding:14px}
  .big-num{font-size:34px;font-weight:900;background:var(--g2);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* fx */
  #toast{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);z-index:100;background:rgba(14,20,40,.92);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:13px;font-weight:600;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(14px);box-shadow:0 10px 30px -6px #000}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fl{position:fixed;z-index:120;font-weight:900;font-size:26px;pointer-events:none;text-shadow:0 3px 10px #000a;transform:translateX(-50%);animation:fl 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes fl{from{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  .sp{position:fixed;z-index:120;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:sp .7s ease-out forwards}
  @keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .shake{animation:shk .25s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .smoke{animation:sm 4s infinite linear}@keyframes sm{from{transform:translateY(0) scale(1);opacity:.55}to{transform:translateY(-22px) scale(1.8);opacity:0}}
  .win{animation:tw 3s infinite alternate}@keyframes tw{50%{opacity:.35}}
</style>
</head>

<header>
  <div class="brand">
    <div class="logo">Industry<small>ACTION</small></div>
    <button class="iconbtn" id="snd" aria-label="Ton">🔊</button>
  </div>
  <div class="hud">
    <div class="pill"><svg width="30" height="30"><use href="#i-coin"/></svg><div><b class="num" id="money">0</b><span>Credits</span></div></div>
    <div class="pill" style="flex:0 0 auto"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle id="ringc" cx="22" cy="22" r="18" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="transition:stroke-dashoffset .5s"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs></svg><b id="lvl">1</b></div><div><b style="font-size:13px">Level</b><span>Fabrik</span></div></div>
    <div class="pill" style="flex:0 0 auto"><svg width="30" height="30"><use href="#i-truck"/></svg><div><b class="num" id="capi">20</b><span>Laderaum</span></div></div>
  </div>
</header>

<main>
  <section class="screen on" id="s-work"></section>
  <section class="screen" id="s-store"></section>

<script>
/* ===== Daten ===== */
const ic=(k,s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><use href="#i-${k}"/></svg>`;
const G={
 erz:{n:'Eisenerz',base:3,c:'#f59e0b'},kohle:{n:'Kohle',base:3,c:'#94a3b8'},lehm:{n:'Lehm',base:2,c:'#d97706'},
 ziegel:{n:'Ziegel',base:8,c:'#ef4444'},stahl:{n:'Stahl',base:20,c:'#38bdf8'},maschine:{n:'Maschine',base:100,c:'#fbbf24'}
};
const GK=Object.keys(G);
const ST=[
 {id:'erz',n:'Eisenerz abbauen',game:'timing',in:{},out:'erz',max:8,mult:'pick',tip:'Timing: Triff die grüne Zone'},
 {id:'kohle',n:'Kohle abbauen',game:'timing',in:{},out:'kohle',max:8,mult:'pick',tip:'Timing: Triff die grüne Zone'},
 {id:'lehm',n:'Lehm graben',game:'timing',in:{},out:'lehm',max:8,mult:'pick',tip:'Timing: Triff die grüne Zone'},
 {id:'ziegel',n:'Ziegelpresse',game:'mash',in:{lehm:4},out:'ziegel',max:3,mult:'bench',tip:'Tempo: Tippe so schnell du kannst'},
 {id:'stahl',n:'Schmelzofen',game:'heat',in:{erz:4,kohle:2},out:'stahl',max:3,mult:'bench',tip:'Gefühl: Halte die Hitze im Bereich'},
 {id:'maschine',n:'Montage',game:'simon',in:{stahl:3,ziegel:2},out:'maschine',max:2,mult:'bench',tip:'Gedächtnis: Merke dir die Folge'}
];
const ROUTES=[
 {id:'stadt',n:'Stadtmarkt',icon:'stadt',T:20,speed:170,mult:1.0,desc:'Kurze, sichere Strecke',c:'#22d3ee'},
 {id:'hafen',n:'Hafenmarkt',icon:'hafen',T:35,speed:230,mult:1.6,desc:'Weit & schnell · +60% Preis',c:'#7c5cff'}
];
const UP=[
 {id:'pick',n:'Spitzhacke',d:'+30% Ertrag beim Abbauen',base:60,i:'erz',c:'#f59e0b'},
 {id:'bench',n:'Werkbank',d:'+30% Ertrag bei Presse, Ofen & Montage',base:120,i:'maschine',c:'#fbbf24'},
 {id:'truck',n:'LKW-Ladefläche',d:'+10 Plätze pro Fahrt',base:80,i:'truck',c:'#22d3ee'},
 {id:'store',n:'Lagerhalle',d:'+100 Lagerplatz pro Ware',base:50,i:'ziegel',c:'#ef4444'},
 {id:'worker',n:'Arbeiter',d:'Fördern Rohstoffe automatisch (+0.08/s je Stufe)',base:200,i:'kohle',c:'#94a3b8'}
];
const SAVE='industry-action-v2';
const $=id=>document.getElementById(id);
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':(Math.round(n*10)/10).toString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let S={money:30,xp:0,stock:{},up:{},last:Date.now(),hist:{},mute:false};
try{const l=JSON.parse(localStorage.getItem(SAVE));if(l&&l.stock)S=Object.assign(S,l)}catch(e){}
GK.forEach(g=>{if(S.stock[g]==null)S.stock[g]=0;if(!S.hist[g])S.hist[g]=[]});
UP.forEach(u=>{if(S.up[u.id]==null)S.up[u.id]=0});
const mood={},sat={};GK.forEach(g=>{mood[g]=1;sat[g]=0});
const lvl=()=>1+Math.floor(Math.sqrt(S.xp/40));
const cap=()=>100+100*S.up.store;
const truckCap=()=>20+10*S.up.truck;
const mult=k=>1+0.3*S.up[k];
const upCost=u=>Math.ceil(u.base*Math.pow(1.8,S.up[u.id]));
const price=g=>Math.max(0.2,G[g].base*mood[g]/(1+sat[g]/60));

/* ===== Sound, Haptik, Effekte ===== */
let AC=null;
function tone(f,d=.1,type='sine',v=.06,slide=0){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const SFX={
  tick:()=>tone(520,.05,'triangle',.04),good:()=>tone(660,.12,'triangle',.07),perfect:()=>{tone(784,.1,'triangle',.07);setTimeout(()=>tone(1175,.18,'triangle',.07),80)},
  miss:()=>tone(160,.18,'sawtooth',.05,-60),coin:()=>{tone(988,.07,'square',.04);setTimeout(()=>tone(1319,.12,'square',.04),60)},
  crash:()=>tone(120,.35,'sawtooth',.09,-80),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.07),i*90)),
  buy:()=>{tone(440,.08,'triangle',.06);setTimeout(()=>tone(880,.14,'triangle',.06),70)},err:()=>tone(200,.15,'square',.04)
};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function fx(txt,color='#fbbf24',x=innerWidth/2,y=innerHeight*.38){const e=document.createElement('div');e.className='fl';e.textContent=txt;e.style.cssText=`left:${x}px;top:${y}px;color:${color}`;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function burst(x,y,color='#fbbf24',n=14){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='sp';const a=Math.random()*6.28,r=30+Math.random()*50;
  e.style.cssText=`left:${x}px;top:${y}px;background:${color};box-shadow:0 0 8px ${color};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),700)}}
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3200)}
$('snd').onclick=()=>{S.mute=!S.mute;$('snd').textContent=S.mute?'🔇':'🔊';if(!S.mute)SFX.good()};
$('snd').textContent=S.mute?'🔇':'🔊';

/* offline: Arbeiter */
(function(){const dt=Math.min((Date.now()-S.last)/1000,8*3600);if(dt<30||!S.up.worker)return;
  ['erz','kohle','lehm'].forEach(g=>S.stock[g]=Math.min(cap(),S.stock[g]+0.08*S.up.worker*dt));
  setTimeout(()=>toast('Deine Arbeiter haben in deiner Abwesenheit Rohstoffe gefördert.'),400)})();

/* ===== Overlay ===== */
let OV=null;
function openOv(html){if(OV){OV.alive=false;OV.abort&&OV.abort()}OV={alive:true,abort:null};$('ovbox').innerHTML=html;$('ov').style.display='flex';return OV}
function closeOv(){if(OV){OV.alive=false;OV.abort&&OV.abort();OV=null}$('ov').style.display='none';$('ovbox').innerHTML=''}
const xbtn=()=>`<button class="x" id="ovx">✕</button>`;
function bindX(){const x=$('ovx');if(x)x.onclick=closeOv}
const pop=(el,t)=>{el.textContent=t;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};
const center=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};

/* ===== Minispiele (Score 0..1, null = abgebrochen) ===== */
function gTiming(rounds=6){return new Promise(res=>{
  const ov=openOv(xbtn()+`<h3>Abbau</h3><div class="sub">Stoppe den Marker in der grünen Zone. Die Mitte zählt perfekt.</div><div class="dots" id="dots">${'<i></i>'.repeat(rounds)}</div><div class="msg" id="m">Los!</div><div class="track" id="b"><div class="zone" id="z"></div><div class="mark" id="k"></div></div><button class="btn big" id="hit">SCHLAG!</button>`);
  bindX();ov.abort=()=>res(null);
  let pos=0,dir=1,speed=0.9,zone=0.2,zc=0.5,round=0,pts=0,last=performance.now();
  const newZone=()=>{zc=0.2+Math.random()*0.6;$('z').style.left=((zc-zone/2)*100)+'%';$('z').style.width=(zone*100)+'%'};newZone();
  function tick(t){if(!ov.alive)return;const dt=(t-last)/1000;last=t;pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}$('k').style.left=(pos*100)+'%';requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  $('hit').onpointerdown=async e=>{
    if(!ov.alive||$('hit').disabled)return;const d=Math.abs(pos-zc);let p=0,t='Daneben!',cl='m';
    const [bx,by]=center($('k'));
    if(d<=zone*0.25){p=1;t='PERFEKT! 🔥';cl='p';SFX.perfect();vib(30);burst(bx,by,'#fbbf24',18)}
    else if(d<=zone/2){p=0.6;t='Gut!';cl='g';SFX.good();vib(15);burst(bx,by,'#34d399',10)}
    else{SFX.miss();vib([40,30,40]);$('ovbox').classList.remove('shake');void $('ovbox').offsetWidth;$('ovbox').classList.add('shake')}
    pts+=p;pop($('m'),t);$('dots').children[round].className=cl;round++;speed+=0.15;
    if(round>=rounds){$('hit').disabled=true;await sleep(700);if(ov.alive)res(pts/rounds);return}
    newZone()};
})}
function gMash(){return new Promise(res=>{
  const ov=openOv(xbtn()+`<h3>Ziegelpresse</h3><div class="sub">Tippe so schnell du kannst. 6 Sekunden ab dem ersten Schlag.</div><div class="msg" id="m">Tippe zum Start!</div><div class="meter" style="height:16px;margin:6px 0 16px"><i id="f" style="width:0;background:var(--g2)"></i></div><button class="tapbtn" id="t">PRESSEN!</button><div class="timer" style="margin-top:14px"><i id="tm" style="width:100%"></i></div>`);
  bindX();ov.abort=()=>res(null);
  let taps=0,started=false;const target=36;
  $('t').onpointerdown=e=>{
    if(!ov.alive||$('t').disabled)return;taps++;SFX.tick();vib(8);burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2,'#fbbf24',4);
    $('f').style.width=Math.min(100,taps/target*100)+'%';$('m').textContent=taps+' Schläge';
    if(!started){started=true;const t0=performance.now();
      const iv=setInterval(()=>{if(!ov.alive){clearInterval(iv);return}const l=Math.max(0,1-(performance.now()-t0)/6000);$('tm').style.width=(l*100)+'%';
        if(l<=0){clearInterval(iv);$('t').disabled=true;pop($('m'),taps>=target?'MAXIMAL! 💥':taps+' Schläge');setTimeout(()=>ov.alive&&res(Math.min(1,taps/target)),600)}},50)}};
})}
function gHeat(){return new Promise(res=>{
  const ov=openOv(xbtn()+`<h3>Schmelzofen</h3><div class="sub">Halte den Knopf zum Heizen. Lass los zum Abkühlen. Bleib im Bereich!</div><div class="msg" id="m">Aufheizen …</div><div class="track heat" style="height:52px"><div class="zone" style="left:45%;width:25%"></div><div class="mark" id="k"></div></div><div class="timer"><i id="tm" style="width:100%"></i></div><button class="btn big r" id="h" style="height:120px;margin-top:16px;font-size:22px">🔥 HEIZEN (halten)</button>`);
  bindX();ov.abort=()=>res(null);
  let temp=25,hold=false,inZ=0,tt=0,last=performance.now(),prev='';const D=12;
  const on=e=>{hold=true;e.preventDefault()},off=()=>hold=false;
  $('h').onpointerdown=on;$('h').onpointerup=off;$('h').onpointerleave=off;$('h').onpointercancel=off;
  function tick(t){if(!ov.alive)return;const dt=Math.min(0.05,(t-last)/1000);last=t;
    temp+=(hold?34:-20)*dt+(Math.random()-0.5)*14*dt;temp=Math.max(0,Math.min(100,temp));
    tt+=dt;const z=temp>=45&&temp<=70;if(z)inZ+=dt;
    $('k').style.left=temp+'%';$('tm').style.width=(100-tt/D*100)+'%';
    const s=temp>70?'Zu heiß! 🥵':temp<45?'Zu kalt! 🥶':'Perfekt! 👍';if(s!==prev){pop($('m'),s);prev=s;if(z)SFX.good();else SFX.tick()}
    if(tt>=D){res(inZ/D);return}requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
})}
function gSimon(){return new Promise(res=>{
  const col=['#ef4444','#22c55e','#3b82f6','#eab308'],fq=[262,330,392,523];
  const ROUNDS=5;
  const ov=openOv(xbtn()+`<h3>Montage</h3><div class="sub">Schau zu, dann wiederhole die Folge.</div><div class="dots" id="dots">${'<i></i>'.repeat(ROUNDS)}</div><div class="msg" id="m">Merke dir die Reihenfolge …</div><div class="pads">${col.map((c,i)=>`<button class="pad" data-i="${i}" style="background:linear-gradient(160deg,${c},color-mix(in srgb,${c} 55%,#000));--pc:${c}"></button>`).join('')}</div>`);
  bindX();ov.abort=()=>res(null);
  const pads=[...document.querySelectorAll('.pad')];
  const flash=async(i,d=350)=>{pads[i].classList.add('lit');tone(fq[i],d/1000,'triangle',.08);await sleep(d);pads[i].classList.remove('lit');await sleep(150)};
  let seq=[],done=0,listen=null;
  pads.forEach((p,i)=>p.onpointerdown=()=>{if(listen){p.classList.add('lit');tone(fq[i],.15,'triangle',.08);vib(10);setTimeout(()=>p.classList.remove('lit'),150);listen(i)}});
  (async()=>{
    for(let r=0;r<ROUNDS;r++){
      seq.push(Math.floor(Math.random()*4));pop($('m'),'Schau genau …');await sleep(500);
      for(const i of seq){if(!ov.alive)return;await flash(i,Math.max(220,350-r*25))}
      if(!ov.alive)return;pop($('m'),'Du bist dran!');
      const ok=await new Promise(r2=>{let k=0;listen=i=>{if(i!==seq[k]){listen=null;r2(false)}else if(++k>=seq.length){listen=null;r2(true)}}});
      if(!ov.alive)return;
      if(!ok){pop($('m'),'Falsch! ❌');SFX.miss();$('dots').children[r].className='m';await sleep(900);break}
      done++;$('dots').children[r].className='g';pop($('m'),'Richtig! ✅');SFX.good();await sleep(550);
    }
    if(ov.alive)res(done/ROUNDS);
  })();
})}
const GAMES={timing:gTiming,mash:gMash,heat:gHeat,simon:gSimon};

/* ===== Station starten ===== */
async function runStation(s,srcEl){
  for(const k in s.in)if(S.stock[k]<s.in[k]){SFX.err();toast('Es fehlt: '+(s.in[k]-Math.floor(S.stock[k]))+'× '+G[k].n);return}
  if(S.stock[s.out]>=cap()){SFX.err();toast('Lager für '+G[s.out].n+' ist voll – bring Ware zum Markt!');return}
  const score=await GAMES[s.game]();
  if(score==null)return;
  closeOv();
  for(const k in s.in)S.stock[k]-=s.in[k];
  let out=Math.round(score*s.max*mult(s.mult));
  if(score>=0.3&&out<1)out=1;
  out=Math.min(out,Math.floor(cap()-S.stock[s.out]));
  S.stock[s.out]+=out;S.xp+=out*(G[s.out].base>10?4:1)+1;
  if(out>0){SFX.win();vib([30,40,60]);fx('+'+out+' '+G[s.out].n,G[s.out].c);burst(innerWidth/2,innerHeight*.4,G[s.out].c,20)}
  else{SFX.crash();fx('Fehlschlag','#fb7185')}
  toast(out>0?`Score ${Math.round(score*100)}% – ${out}× ${G[s.out].n} hergestellt`:'Material verloren 😬 Versuch es nochmal!');
  render();
}

/* ===== Transport (Fahrspiel) ===== */
let cargo={};
function drive(route,units){return new Promise(res=>{
  const ov=openOv(`<h3>Fahrt · ${route.n}</h3><div class="sub">Tippe links/rechts oder wische. Weiche aus, sammle Münzen.</div><canvas id="cv"></canvas><div class="ctrl"><button class="btn ghost" id="L">◀</button><button class="btn ghost" id="R">▶</button></div>`);
  const cv=$('cv'),W=320,H=440,DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
  const c=cv.getContext('2d');c.scale(DPR,DPR);
  const LX=[80,160,240],TY=350;
  let lane=1,x=160,integ=100,t=0,coins=0,obs=[],parts=[],spawn=0.6,off=0,inv=0,flash=0,shake=0,over=null,overT=0,last=performance.now(),ex=0;
  const trees=[];for(let i=0;i<10;i++){trees.push({s:i%2?1:-1,y:i*48+Math.random()*20,r:9+Math.random()*7,dx:Math.random()*8})}
  const mv=d=>{const n=Math.max(0,Math.min(2,lane+d));if(n!==lane){lane=n;SFX.tick()}};
  $('L').onpointerdown=()=>mv(-1);$('R').onpointerdown=()=>mv(1);
  let sx=null;
  cv.onpointerdown=e=>{sx=e.clientX;const r=cv.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)};
  cv.onpointermove=e=>{if(sx!=null&&Math.abs(e.clientX-sx)>40){mv(e.clientX>sx?1:-1);sx=e.clientX}};
  cv.onpointerup=()=>sx=null;
  const key=e=>{if(!OV||!OV.alive)return removeEventListener('keydown',key);if(e.key==='ArrowLeft')mv(-1);if(e.key==='ArrowRight')mv(1)};
  addEventListener('keydown',key);
  const speed=()=>route.speed+t*3;
  const sh=(px,py,rx,ry,a=.35)=>{c.fillStyle=`rgba(0,0,0,${a})`;c.beginPath();c.ellipse(px,py,rx,ry,0,0,7);c.fill()};
  const burstP=(px,py,col,n)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,v=60+Math.random()*140;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c:col})}};
  function drawObs(o){
    if(o.k==='coin'){const s=Math.abs(Math.cos(t*7+o.x));sh(o.x,o.y+14,10*s+2,4,.3);c.save();c.translate(o.x,o.y);c.scale(Math.max(.12,s),1);
      const g=c.createLinearGradient(-11,-11,11,11);g.addColorStop(0,'#fff0a8');g.addColorStop(.5,'#fbbf24');g.addColorStop(1,'#d97706');c.fillStyle=g;c.shadowColor='#fbbf24';c.shadowBlur=14;c.beginPath();c.arc(0,0,11,0,7);c.fill();c.shadowBlur=0;c.strokeStyle='#b45309';c.lineWidth=2;c.beginPath();c.arc(0,0,7,0,7);c.stroke();c.restore();return}
    if(o.k==='rock'){sh(o.x+4,o.y+16,24,8);const g=c.createLinearGradient(o.x-22,o.y-18,o.x+22,o.y+16);g.addColorStop(0,'#b6bcc9');g.addColorStop(1,'#4b5263');c.fillStyle=g;c.beginPath();c.moveTo(o.x-22,o.y+12);c.lineTo(o.x-15,o.y-12);c.lineTo(o.x+6,o.y-19);c.lineTo(o.x+23,o.y-2);c.lineTo(o.x+18,o.y+15);c.closePath();c.fill();c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.moveTo(o.x-15,o.y-12);c.lineTo(o.x+6,o.y-19);c.lineTo(o.x+2,o.y-4);c.lineTo(o.x-12,o.y+2);c.fill();return}
    if(o.k==='cone'){sh(o.x+3,o.y+17,14,5);const g=c.createLinearGradient(o.x-14,0,o.x+14,0);g.addColorStop(0,'#ff9a3c');g.addColorStop(1,'#e8590c');c.fillStyle=g;c.beginPath();c.moveTo(o.x,o.y-22);c.lineTo(o.x+14,o.y+14);c.lineTo(o.x-14,o.y+14);c.closePath();c.fill();c.fillStyle='#fff';c.beginPath();c.moveTo(o.x-6,o.y-4);c.lineTo(o.x+6,o.y-4);c.lineTo(o.x+8,o.y+3);c.lineTo(o.x-8,o.y+3);c.fill();c.fillStyle='#c2410c';c.fillRect(o.x-17,o.y+13,34,5);return}
    sh(o.x,o.y+12,34,6);c.fillStyle='#fff';c.fillRect(o.x-32,o.y-9,64,18);for(let i=0;i<5;i++){c.fillStyle='#e11d48';c.beginPath();c.moveTo(o.x-32+i*13,o.y+9);c.lineTo(o.x-32+i*13+7,o.y-9);c.lineTo(o.x-32+i*13+14,o.y-9);c.lineTo(o.x-32+i*13+7,o.y+9);c.fill()}
    c.fillStyle='#fff8';c.fillRect(o.x-32,o.y-9,64,3)}
  function drawTruck(){
    if(inv>0&&Math.floor(inv*12)%2)return;
    const hl=c.createLinearGradient(0,TY-40,0,TY-190);hl.addColorStop(0,'rgba(255,248,200,.35)');hl.addColorStop(1,'rgba(255,248,200,0)');c.fillStyle=hl;c.beginPath();c.moveTo(x-14,TY-40);c.lineTo(x-34,TY-190);c.lineTo(x+34,TY-190);c.lineTo(x+14,TY-40);c.fill();
    sh(x+5,TY+16,26,40,.4);
    ex+=0;c.fillStyle='#0b0e16';[[-23,-30],[17,-30],[-23,14],[17,14]].forEach(([a,b])=>{c.beginPath();c.roundRect(x+a,TY+b,7,18,3);c.fill()});
    let g=c.createLinearGradient(x-18,0,x+18,0);g.addColorStop(0,'#cbd5e1');g.addColorStop(.5,'#f1f5f9');g.addColorStop(1,'#94a3b8');
    c.fillStyle=g;c.beginPath();c.roundRect(x-19,TY-8,38,48,5);c.fill();c.fillStyle='rgba(15,23,42,.18)';for(let i=1;i<5;i++)c.fillRect(x-19,TY-8+i*9.6,38,1.5);
    g=c.createLinearGradient(x-17,0,x+17,0);g.addColorStop(0,'#f43f5e');g.addColorStop(.5,'#ff7a8a');g.addColorStop(1,'#be123c');c.fillStyle=g;c.beginPath();c.roundRect(x-18,TY-44,36,38,9);c.fill();
    g=c.createLinearGradient(0,TY-40,0,TY-26);g.addColorStop(0,'#e0f2fe');g.addColorStop(1,'#38bdf8');c.fillStyle=g;c.beginPath();c.roundRect(x-13,TY-40,26,13,4);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(x-12,TY-45,3,0,7);c.arc(x+12,TY-45,3,0,7);c.fill();
    c.fillStyle='#ef4444';c.beginPath();c.arc(x-12,TY+41,2.5,0,7);c.arc(x+12,TY+41,2.5,0,7);c.fill()}
  function frame(now){
    if(!ov.alive){removeEventListener('keydown',key);return}
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!over){t+=dt;inv=Math.max(0,inv-dt);
      x+=(LX[lane]-x)*Math.min(1,dt*14);off=(off+speed()*dt)%80;
      spawn-=dt;if(spawn<=0){spawn=Math.max(0.28,(0.85-t*0.012)*(170/speed()+0.4));
        const l=Math.floor(Math.random()*3),r=Math.random(),k=r<0.25?'coin':r<0.55?'rock':r<0.85?'cone':'barrier';obs.push({k,x:LX[l],y:-40})}
      obs.forEach(o=>o.y+=speed()*dt);
      obs=obs.filter(o=>{
        if(o.y>TY-50&&o.y<TY+40&&Math.abs(o.x-x)<(o.k==='barrier'?38:30)){
          if(o.k==='coin'){coins++;SFX.coin();vib(10);burstP(o.x,o.y,'#fbbf24',10);return false}
          if(inv<=0){integ-=20;inv=1;flash=1;shake=.3;SFX.crash();vib([60,30,80]);burstP(x,TY-10,'#ffb84d',16)}
          return true}
        return o.y<500});
      trees.forEach(tr=>{tr.y+=speed()*dt;if(tr.y>H+30){tr.y=-30;tr.r=9+Math.random()*7;tr.dx=Math.random()*8}});
      if(t>=route.T||integ<=0){over=integ<=0?'wreck':'ok';overT=0;if(over==='ok')SFX.win()}
    }else{overT+=dt;if(overT>1.1&&!ov.done){ov.done=true;const r={integ:Math.max(0,integ),coins};removeEventListener('keydown',key);closeOv();res(r);return}}
    shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*2.5);
    parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
    // Render
    c.save();if(shake>0)c.translate((Math.random()-.5)*8*shake*3,(Math.random()-.5)*8*shake*3);
    for(let i=-1;i<6;i++){c.fillStyle=(i%2)?'#1f5a38':'#236640';c.fillRect(0,i*80+off,W,80)}
    trees.forEach(tr=>{const tx=tr.s<0?12+tr.dx:W-12-tr.dx;sh(tx+4,tr.y+6,tr.r,tr.r*.5,.3);const g=c.createRadialGradient(tx-3,tr.y-4,2,tx,tr.y,tr.r);g.addColorStop(0,'#5fd28b');g.addColorStop(1,'#14532d');c.fillStyle=g;c.beginPath();c.arc(tx,tr.y,tr.r,0,7);c.fill()});
    let g=c.createLinearGradient(30,0,290,0);g.addColorStop(0,'#2a2f3c');g.addColorStop(.5,'#363c4c');g.addColorStop(1,'#2a2f3c');c.fillStyle=g;c.fillRect(30,0,260,H);
    for(let i=-2;i<12;i++){c.fillStyle=(i%2)?'#e11d48':'#f8fafc';c.fillRect(24,i*40+off,6,40);c.fillRect(290,i*40+off,6,40)}
    c.fillStyle='rgba(255,255,255,.85)';for(let l=1;l<3;l++)for(let y=-80;y<H+40;y+=80){c.fillRect(l*80+40-2,y+off,4,36)}
    if(speed()>210){c.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<8;i++){c.fillRect(40+i*32,(off*3+i*97)%H,2,50)}}
    obs.slice().sort((a,b)=>a.y-b.y).forEach(drawObs);
    drawTruck();
    parts.forEach(p=>{c.globalAlpha=Math.max(0,p.l/.6);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,3,0,7);c.fill()});c.globalAlpha=1;
    const v=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=v;c.fillRect(0,0,W,H);
    if(flash>0){c.fillStyle=`rgba(255,40,60,${flash*.45})`;c.fillRect(0,0,W,H)}
    c.restore();
    // HUD
    c.fillStyle='rgba(8,12,24,.65)';c.beginPath();c.roundRect(10,10,110,28,14);c.fill();
    const ig=Math.max(0,integ)/100;c.fillStyle='rgba(255,255,255,.15)';c.beginPath();c.roundRect(18,20,94,8,4);c.fill();
    c.fillStyle=ig>.6?'#34d399':ig>.3?'#fbbf24':'#fb7185';c.beginPath();c.roundRect(18,20,Math.max(0,94*ig),8,4);c.fill();
    c.fillStyle='rgba(8,12,24,.65)';c.beginPath();c.roundRect(W-80,10,70,28,14);c.fill();c.fillStyle='#fbbf24';c.beginPath();c.arc(W-64,24,7,0,7);c.fill();
    c.fillStyle='#fff';c.font='800 14px system-ui,sans-serif';c.textAlign='left';c.fillText(String(coins),W-50,29);
    c.fillStyle='rgba(8,12,24,.65)';c.beginPath();c.roundRect(10,H-26,W-20,14,7);c.fill();
    const pr=Math.min(1,t/route.T);g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#22d3ee');g.addColorStop(1,'#7c5cff');c.fillStyle=g;c.beginPath();c.roundRect(12,H-24,Math.max(10,(W-24)*pr),10,5);c.fill();
    if(over){c.fillStyle='rgba(5,8,18,.55)';c.fillRect(0,0,W,H);c.fillStyle='#fff';c.textAlign='center';c.font='900 34px system-ui,sans-serif';c.fillText(over==='ok'?'ANGEKOMMEN!':'TOTALSCHADEN!',W/2,H/2);c.textAlign='left'}
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})}
async function startDrive(route){
  const total=Object.values(cargo).reduce((a,b)=>a+b,0);if(!total){toast('Lade zuerst Ware auf!');return}
  const load={...cargo};cargo={};GK.forEach(g=>{if(load[g])S.stock[g]-=load[g]});
  const r=await drive(route,load);
  let val=0;for(const g in load){for(let i=0;i<load[g];i++){val+=price(g);sat[g]+=1}}
  val*=route.mult;const pay=Math.floor(val*r.integ/100)+r.coins*5;
  S.money+=pay;S.xp+=Math.ceil(pay/8);
  const stars=r.integ>=100?3:r.integ>=60?2:r.integ>0?1:0;
  openOv(`<h3 style="text-align:center;font-size:24px">${r.integ>0?'Lieferung erfolgreich':'Totalschaden'}</h3>
   <div style="text-align:center;font-size:38px;letter-spacing:8px;margin:6px 0">${'★'.repeat(stars)}<span style="opacity:.2">${'★'.repeat(3-stars)}</span></div>
   <div class="card" style="--c:#22d3ee;margin:8px 0"><div class="i">Zustand der Ladung<small>Warenwert ${fmt(val)} × ${r.integ}%</small></div><b style="font-size:20px">${r.integ}%</b></div>
   <div class="card" style="--c:#fbbf24;margin:8px 0"><div class="i">Münzen<small>${r.coins} × 5 Credits</small></div><b style="font-size:20px">+${r.coins*5}</b></div>
   <div style="text-align:center;margin:12px 0 16px"><div class="big-num">+${fmt(pay)}</div><div class="sub">Credits</div></div><button class="btn big b" id="ok">Weiter</button>`);
  if(pay>0){SFX.win();burst(innerWidth/2,innerHeight*.35,'#fbbf24',24)}
  $('ok').onclick=()=>{closeOv();render()};
}

/* ===== Screens ===== */
function renderWork(){
  const el=$('s-work');el.innerHTML='<h2>Werkstatt</h2><p class="sub">Stelle Waren in Minispielen selbst her.</p>';
  ST.forEach(s=>{
    const need=Object.keys(s.in).map(k=>`<span class="${S.stock[k]>=s.in[k]?'up':'dn'}">${s.in[k]}× ${G[k].n} (${Math.floor(S.stock[k])})</span>`).join(' · ');
    const can=Object.keys(s.in).every(k=>S.stock[k]>=s.in[k]);
    const d=document.createElement('div');d.className='card';d.style.setProperty('--c',G[s.out].c);
    d.innerHTML=`<div class="art">${ic(s.out,42)}</div><div class="i">${s.n}<small>${s.tip}</small><small>${need?'Braucht '+need:'Kostenlos'} → bis ${Math.max(1,Math.round(s.max*mult(s.mult)))}× ${G[s.out].n}</small></div><button class="btn ${can?'':'ghost'}">Spielen</button>`;
    d.querySelector('button').onclick=()=>runStation(s);el.appendChild(d)});
}
function renderStore(){
  const el=$('s-store');el.innerHTML='<h2>Lager</h2><p class="sub">Deine Vorräte. Kapazität pro Ware: '+cap()+'</p>';
  GK.forEach(g=>{const d=document.createElement('div');d.className='card';d.style.setProperty('--c',G[g].c);const f=S.stock[g]/cap();
    d.innerHTML=`<div class="art">${ic(g,42)}</div><div class="i">${G[g].n} <span class="chip num">${Math.floor(S.stock[g])} / ${cap()}</span><div class="meter"><i style="width:${f*100}%;background:${f>.9?'var(--g4)':'linear-gradient(90deg,'+G[g].c+',#fff6)'}"></i></div></div>`;el.appendChild(d)});
}
function renderShip(){
  const el=$('s-ship');const used=Object.values(cargo).reduce((a,b)=>a+b,0);
  let est=0;for(const g in cargo)est+=price(g)*cargo[g];
  el.innerHTML=`<h2>Transport</h2><p class="sub">Belade den LKW und bring die Ware zum Markt.</p>
   <div class="card" style="--c:#22d3ee"><div class="art">${ic('truck',44)}</div><div class="i">Ladefläche <span class="chip num">${used} / ${truckCap()}</span><div class="meter"><i style="width:${used/truckCap()*100}%"></i></div><small>Geschätzter Warenwert: ${fmt(est)} Credits</small></div></div>`;
  GK.forEach(g=>{const have=Math.floor(S.stock[g]),c=cargo[g]||0;
    const d=document.createElement('div');d.className='card';d.style.setProperty('--c',G[g].c);
    d.innerHTML=`<div class="art" style="width:48px;height:48px;flex-basis:48px">${ic(g,34)}</div><div class="i">${G[g].n}<small>Lager ${have} · ~${price(g).toFixed(1)}/Stk</small></div><div class="step"><button data-d="-1">−</button><b class="num">${c}</b><button data-d="1">+</button><button data-d="max" style="width:46px;font-size:11px;font-weight:800">MAX</button></div>`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const free=truckCap()-Object.values(cargo).reduce((a,x)=>a+x,0);
      let n=b.dataset.d==='max'?Math.min(free,have-c):parseInt(b.dataset.d);
      n=Math.max(-c,Math.min(n,free,have-c));if(n)SFX.tick();cargo[g]=c+n;renderShip()});
    el.appendChild(d)});
  ROUTES.forEach(r=>{const d=document.createElement('div');d.className='card';d.style.setProperty('--c',r.c);
    d.innerHTML=`<div class="art">${ic(r.icon,44)}</div><div class="i">${r.n}<small>${r.desc} · ${r.T}s</small></div><button class="btn b" ${used?'':'disabled'}>Fahren</button>`;
    d.querySelector('button').onclick=()=>startDrive(r);el.appendChild(d)});
}
function spark(g){const h=S.hist[g];if(h.length<2)return '';const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
  const pts=h.map((v,i)=>[(i/(h.length-1)*84),(26-(v-mn)/r*22)]);const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg width="84" height="30" viewBox="0 0 84 30"><defs><linearGradient id="sf${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G[g].c}" stop-opacity=".45"/><stop offset="1" stop-color="${G[g].c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,30 ${line} 84,30" fill="url(#sf${g})"/><polyline points="${line}" fill="none" stroke="${G[g].c}" stroke-width="2" stroke-linejoin="round"/></svg>`}
function renderMarket(){
  const el=$('s-market');el.innerHTML='<h2>Markt</h2><p class="sub">Preise schwanken. Viel verkaufen drückt den Preis. Der Hafen zahlt +60%.</p>';
  GK.forEach(g=>{const p=price(g),d=p/G[g].base,c=document.createElement('div');c.className='card';c.style.setProperty('--c',G[g].c);
    const tag=mood[g]>1.8?'<span class="chip up">🔥 BOOM</span>':mood[g]<.6?'<span class="chip dn">❄️ CRASH</span>':'';
    c.innerHTML=`<div class="art">${ic(g,42)}</div><div class="i">${G[g].n} ${tag}<small><b class="num" style="font-size:17px;color:var(--ink)">${p.toFixed(2)}</b> / Stk · <span class="${d>=1?'up':'dn'}">${d>=1?'▲':'▼'} ${Math.round(Math.abs(d-1)*100)}%</span></small></div>${spark(g)}`;el.appendChild(c)});
}
function renderUpg(){
  const el=$('s-upg');el.innerHTML='<h2>Upgrades</h2><p class="sub">Investiere deine Credits in bessere Ausrüstung.</p>';
  UP.forEach(u=>{const d=document.createElement('div'),cost=upCost(u);d.className='card';d.style.setProperty('--c',u.c);
    d.innerHTML=`<div class="art">${ic(u.i,42)}</div><div class="i">${u.n}<small>${u.d}</small><div class="pips">${Array.from({length:10},(_,k)=>`<i class="${k<S.up[u.id]?'on':''}"></i>`).join('')}</div></div><button class="btn a" ${S.money<cost?'disabled':''}>${fmt(cost)}</button>`;
    d.querySelector('button').onclick=e=>{if(S.money>=cost){S.money-=cost;S.up[u.id]++;S.xp+=5;SFX.buy();vib(20);burst(e.clientX,e.clientY,'#fbbf24',14);render()}};el.appendChild(d)});
}
let cur='work',lastLvl=lvl(),shown=S.money;
function render(){
  $('capi').textContent=truckCap();
  const l=lvl(),a=40*(l-1)*(l-1),b=40*l*l;$('lvl').textContent=l;
  $('ringc').style.strokeDashoffset=113.1*(1-Math.max(0,Math.min(1,(S.xp-a)/(b-a))));
  if(l>lastLvl){lastLvl=l;SFX.win();toast('⭐ Level '+l+' erreicht!');fx('LEVEL '+l,'#22d3ee')}
  if(OV)return;
  ({work:renderWork,store:renderStore,ship:renderShip,market:renderMarket,upg:renderUpg})[cur]();
}
(function loop(){shown+=(S.money-shown)*.18;if(Math.abs(S.money-shown)<.5)shown=S.money;$('money').textContent=fmt(Math.floor(shown));requestAnimationFrame(loop)})();
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  cur=b.dataset.s;SFX.tick();document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+cur));$('s-'+cur).scrollTop=0;render()});

/* ===== Hintergrund: Arbeiter, Markt, Events ===== */
let nextEv=Date.now()+40000,histT=0;
setInterval(()=>{
  const dt=1;
  if(S.up.worker)['erz','kohle','lehm'].forEach(g=>S.stock[g]=Math.min(cap(),S.stock[g]+0.08*S.up.worker*dt));
  GK.forEach(g=>{sat[g]*=Math.exp(-dt/45);mood[g]+=(1-mood[g])*0.01+(Math.random()-0.5)*0.03;mood[g]=Math.max(0.35,mood[g])});
  if((histT+=dt)>=4){histT=0;GK.forEach(g=>{S.hist[g].push(price(g));if(S.hist[g].length>30)S.hist[g].shift()})}
  if(Date.now()>nextEv){nextEv=Date.now()+50000+Math.random()*50000;
    const g=GK[Math.floor(Math.random()*GK.length)],up=Math.random()<0.6;mood[g]=up?2.2:0.45;setTimeout(()=>mood[g]=1,35000);
    toast(up?`🔥 Boom! ${G[g].n} ist 35s lang sehr gefragt – schnell liefern!`:`❄️ Preissturz bei ${G[g].n} – lieber lagern!`);SFX.coin()}
  if(!OV&&cur!=='ship'&&cur!=='work')render();
  S.last=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}
},1000);
render();
toast('Starte in der Werkstatt: baue Eisenerz ab!');
</script>
