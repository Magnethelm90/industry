<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Industry Action</title>
<style>
  :root{
    --bg:#070b16;--ink:#eef2ff;--mut:#8a96b8;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);
    --cy:#22d3ee;--vi:#7c5cff;--gold:#fbbf24;--ok:#34d399;--bad:#fb7185;
    --g1:linear-gradient(135deg,#22d3ee,#7c5cff);--g2:linear-gradient(135deg,#fbbf24,#f97316);--g3:linear-gradient(135deg,#34d399,#10b981);--g4:linear-gradient(135deg,#fb7185,#e11d48);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{height:100%;margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.1px}
  body{background:radial-gradient(900px 500px at 10% -10%,#1b2a66 0,transparent 60%),radial-gradient(700px 500px at 100% 10%,#3b1d6e 0,transparent 55%),var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.25;mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%);pointer-events:none}
  .num{font-variant-numeric:tabular-nums}
  /* HUD */
  header{flex:0 0 auto;position:relative;z-index:5;padding:max(10px,env(safe-area-inset-top)) 14px 6px}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .logo{font-weight:800;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:600;letter-spacing:1px;margin-left:6px}
  .hud{display:flex;gap:8px;align-items:stretch}
  .pill{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pill svg{flex:0 0 auto}
  .pill b{font-size:17px;font-weight:800}
  .pill span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .ring{position:relative;width:44px;height:44px;flex:0 0 44px}
  .ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
  .iconbtn{width:44px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:18px;backdrop-filter:blur(14px)}
  /* main */
  main{flex:1;overflow-y:auto;padding:6px 14px 100px;position:relative;z-index:1;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .screen{display:none}.screen.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  h2{margin:8px 2px 2px;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--mut);font-size:13px;margin:0 2px 8px}
  /* cards */
  .card{--c:#7c5cff;position:relative;display:flex;align-items:center;gap:12px;padding:12px;margin:10px 0;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),var(--glass) 60%);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;box-shadow:0 8px 24px -12px #000}
  .card::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .card .i{flex:1;min-width:0;font-size:15px;font-weight:700}
  .card small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:3px;line-height:1.35}
  .art{width:58px;height:58px;flex:0 0 58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 70%);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .art svg{filter:drop-shadow(0 4px 6px #0008)}
  /* buttons */
  .btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14px;color:#07101f;background:var(--g3);box-shadow:0 6px 18px -6px rgba(52,211,153,.7),inset 0 1px 0 #fff6;transition:transform .12s,filter .2s;cursor:pointer}
  .btn:active{transform:scale(.94);filter:brightness(1.15)}
  .btn.b{background:var(--g1);color:#fff;box-shadow:0 6px 18px -6px rgba(124,92,255,.8),inset 0 1px 0 #fff5}
  .btn.a{background:var(--g2);box-shadow:0 6px 18px -6px rgba(249,115,22,.8),inset 0 1px 0 #fff6}
  .btn.r{background:var(--g4);color:#fff;box-shadow:0 6px 18px -6px rgba(225,29,72,.8),inset 0 1px 0 #fff5}
  .btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
  .btn:disabled{background:rgba(255,255,255,.07);color:#6b7692;box-shadow:none;cursor:default}
  .btn.big{width:100%;padding:18px;font-size:19px;border-radius:18px}
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 14px}
  .hole{aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 58%,#03050b 0 46%,#2a3150 47% 62%,#171d36 63%);box-shadow:inset 0 6px 14px #000c,0 2px 0 #ffffff10}
  .rise{display:flex;animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(18px) scale(.4);opacity:0}}
  .seg{display:flex;gap:4px;padding:4px;margin:6px 0 4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .seg button{position:relative;flex:1 0 auto;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:800;font-size:12.5px}
  .seg button.on{background:var(--g1);color:#fff}
  .seg button.dot::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
  .cats{display:flex;gap:6px;overflow-x:auto;margin:8px 0 0;scrollbar-width:none}.cats .chip2{flex:0 0 auto;padding:7px 12px;font-size:12px}
  .plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .plot{position:relative;aspect-ratio:1;max-width:100%;padding:0;border-radius:16px;border:1px solid rgba(255,255,255,.08);overflow:hidden;color:#fff;
    background:repeating-linear-gradient(0deg,#5a3a22 0 9px,#4a2f1b 9px 18px);box-shadow:inset 0 4px 10px rgba(0,0,0,.45)}
  .plot.buy{background:var(--glass);border-style:dashed;box-shadow:none}.plot.buy:disabled{opacity:.5}
  .plot .crop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .5s}
  .plot .pl{position:absolute;left:0;right:0;bottom:6px;font-size:11px;font-weight:800;text-align:center;text-shadow:0 1px 3px #000}
  .plot:not(.buy) .pl:only-child{top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:13px}
  .plot .pbar,.plot .wbar{position:absolute;left:6px;right:6px;height:4px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
  .plot .pbar{top:6px}.plot .pbar i{display:block;height:100%;background:#84cc16}
  .plot .wbar{top:13px}.plot .wbar i{display:block;height:100%;background:#38bdf8}
  .plot.dry{filter:saturate(.4)}.plot.dry .pl{color:#7dd3fc}
  .plot.ready{box-shadow:0 0 0 2px #fbbf24,0 0 18px rgba(251,191,36,.6);animation:rdy 1s infinite alternate}@keyframes rdy{to{box-shadow:0 0 0 2px #fbbf24,0 0 28px rgba(251,191,36,.9)}}
  .plot.pest{box-shadow:0 0 0 2px #fb7185}.plot .bug{position:absolute;right:8px;top:20px;font-size:22px;animation:bugw .4s infinite alternate}@keyframes bugw{to{transform:translate(-6px,4px) rotate(-15deg)}}
  .mold{position:relative;width:150px;height:190px;margin:8px auto;border:4px solid #64748b;border-top:0;border-radius:0 0 18px 18px;background:#0b1020;overflow:hidden}
  .mfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#fff7ae,#fb923c 35%,#dc2626);box-shadow:0 0 22px #f97316}
  .mline{position:absolute;left:0;right:0;height:3px;background:#34d399;box-shadow:0 0 10px #34d399}
  .anvil{position:relative;height:190px;display:flex;align-items:center;justify-content:center}
  .work{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#fff7ae,#f97316 50%,#7c2d12);box-shadow:0 0 34px #f97316}
  .fring{position:absolute;width:92px;height:92px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 14px #fff;pointer-events:none}
  .pipewrap{position:relative;margin:8px 14px 12px}
  .pipes{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;border-radius:14px;background:#0b1020}
  .pc{aspect-ratio:1;max-width:100%;padding:0;border:0;border-radius:8px;background:#1a2242}
  .pc svg{display:block;width:100%;height:100%;transition:transform .15s}.pc path{stroke:#64748b;stroke-width:24;fill:none}
  .pc.on path{stroke:#22d3ee;filter:drop-shadow(0 0 4px #22d3ee)}
  .src,.drn{position:absolute;width:12px;height:22px;margin-top:-11px;border-radius:4px}.src{left:-12px;background:#22d3ee;box-shadow:0 0 10px #22d3ee}.drn{right:-12px;background:#34d399}
  .wires{position:relative;height:250px;margin:8px 0 12px;border-radius:16px;background:#0b1020}
  .wires svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .wn{position:absolute;width:46px;height:30px;padding:0;border:0;border-radius:8px;transform:translate(-50%,-50%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  .wn.sel{box-shadow:0 0 0 3px #fff,0 0 16px #fff}.wn.ok{opacity:.55}
  .belt{position:relative;height:160px;margin:8px 0 12px;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(90deg,#1f2937 0 20px,#273244 20px 40px);animation:beltmv .6s linear infinite}
  @keyframes beltmv{to{background-position:40px 0}}
  .belt .bin{position:absolute;right:0;top:0;bottom:0;width:15%;display:flex;align-items:center;justify-content:center;background:rgba(52,211,153,.18);border-left:2px dashed #34d399}
  .belt .it{position:absolute;padding:0;border:0;background:none;transform:translateY(-50%)}
  .sea{position:relative;height:170px;border-radius:18px;overflow:hidden;background:linear-gradient(#38bdf8,#0369a1 55%,#0c4a6e)}
  .sea .wave{position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 50% 0,transparent 0 18px,rgba(255,255,255,.08) 18px 20px);animation:wv 3s linear infinite}@keyframes wv{to{background-position:0 40px}}
  .bob{position:absolute;left:50%;top:42%;width:18px;height:26px;margin-left:-9px;border-radius:50% 50% 45% 45%;background:linear-gradient(#ef4444 50%,#fff 50%);box-shadow:0 0 0 6px rgba(255,255,255,.12);animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(5px)}}.bob.dip{animation:dip .18s ease-in-out infinite alternate}@keyframes dip{to{transform:translateY(18px)}}.bob.gone{display:none}
  .fishic{position:absolute;bottom:18px;left:15%;transition:left .1s}
  .tens{height:30px;margin:4px 0 8px;background:linear-gradient(90deg,#38bdf8,#34d399 40%,#fbbf24 75%,#ef4444)}
  .wall.gas{box-shadow:inset 0 0 40px rgba(132,204,22,.8);background:#1a2e05}
  nav button.dot::after{content:"";position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:pg2 1s infinite alternate}
  @keyframes pg2{to{transform:scale(1.3)}}
  .pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
  .pk{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:10px;font-weight:700;min-width:0}
  .pk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pk small{color:var(--mut);font-size:10px}
  .pk.on{background:var(--g1);border-color:transparent}.pk.on small{color:#fff}.pk:disabled{opacity:.3}
  .flasks{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
  .flask{width:74px;height:88px;padding:0;border-radius:16px 16px 34px 34px;border:2px solid color-mix(in srgb,var(--c) 70%,#fff);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:28px;
    background:radial-gradient(circle at 50% 78%,color-mix(in srgb,var(--c) 60%,transparent),transparent 70%),rgba(255,255,255,.04)}
  .flask.boil{animation:boil .22s infinite alternate}@keyframes boil{to{transform:translateY(-4px) rotate(3deg);box-shadow:0 0 26px var(--c)}}
  .msg.good{color:var(--ok)}.msg.bad{color:var(--bad);font-size:15px}
  .rank{display:flex;gap:10px;align-items:center;padding:11px 14px;margin:6px 0;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14px}
  .rank b{width:20px;color:var(--mut)}.rank span:nth-child(2){flex:1;min-width:0}
  .rank.me{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(124,92,255,.2));border-color:#7c5cff}
  .ois{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .oi{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 4px;border-radius:99px;background:var(--glass2);font-size:12px;font-weight:700}
  .oi b{font-weight:600;opacity:.8}
  .shelves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .shelf{--c:#7c5cff;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:136px;padding:12px 12px 20px;border-radius:18px;border:1px solid var(--line);color:var(--ink);text-align:left;
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,transparent),var(--glass))}
  .shelf.empty{align-items:center;justify-content:center;border-style:dashed;color:var(--mut)}
  .shelf b{font-size:14px}.shelf small{color:var(--mut);font-size:11.5px}
  .shelf::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:5px;border-radius:3px;background:linear-gradient(90deg,#7c5c3c,#b08458,#7c5c3c)}
  .ava{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
  .amt{display:flex;gap:6px;margin:8px 0 2px}
  .chip2{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-weight:800;font-size:13px}
  .chip2.on{background:var(--g1);border-color:transparent;color:#fff}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.mtop>span{min-width:0}
  .mrow{display:flex;gap:6px;margin-top:8px}
  .btn.sm{flex:1;padding:7px 6px;font-size:12.5px;border-radius:12px}.btn.sm span{display:block;font-size:10.5px;font-weight:700;opacity:.85;margin-top:1px}
  .mixwrap{display:flex;gap:16px;justify-content:center;align-items:flex-end;margin:6px 0}
  .beaker{position:relative;width:120px;height:190px;border:3px solid rgba(203,213,225,.6);border-top:0;border-radius:0 0 24px 24px;overflow:hidden;background:rgba(255,255,255,.04)}
  .liq{position:absolute;inset:0;display:flex;flex-direction:column-reverse}
  .liq i{display:block;flex:0 0 auto;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
  .glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 28%,transparent 72%,rgba(255,255,255,.1))}
  .ruler{width:22px;height:190px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .ruler i{display:block;flex:0 0 auto;opacity:.85;border-top:2px dashed rgba(255,255,255,.7)}
  .pours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .pour{height:80px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:14px;touch-action:none;background:linear-gradient(160deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#000));box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s}
  .pour small{display:block;font-weight:600;font-size:11px;opacity:.9;margin-top:4px}
  .pour.on{transform:scale(.94);box-shadow:0 0 24px var(--pc)}
  .pcb{position:relative;aspect-ratio:1;max-width:100%;margin:8px 0 12px;border-radius:20px;border:1px solid rgba(34,197,94,.35);box-shadow:inset 0 4px 16px #0008;
    background:linear-gradient(90deg,transparent 47%,rgba(250,204,21,.18) 47% 53%,transparent 53%) 0 0/50px 50px,linear-gradient(0deg,transparent 47%,rgba(250,204,21,.18) 47% 53%,transparent 53%) 0 0/50px 50px,radial-gradient(circle at 30% 20%,#1f8a4c,#0b3d22)}
  .spad{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;background:conic-gradient(var(--rc,#fbbf24) calc(var(--p,0) * 1%),rgba(0,0,0,.45) 0)}
  .spad::after{content:"";width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#ca8a04 60%,#713f12)}
  .spad.wait{opacity:.35;pointer-events:none}
  .spad.act{animation:pg .6s infinite alternate}@keyframes pg{from{box-shadow:0 0 0 2px rgba(255,255,255,.3)}to{box-shadow:0 0 0 6px rgba(255,255,255,.15),0 0 26px #fbbf24}}
  .spad.ok,.spad.bad{background:none;pointer-events:none;animation:none}
  .spad.ok::after{background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 40%,#64748b)}
  .spad.bad::after{background:radial-gradient(circle,#1f2937,#000)}
  .phonewrap{display:flex;gap:12px;align-items:center}
  .phone{position:relative;flex:0 0 46%;max-width:170px}.phone svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px #000a)}
  .tray{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .part{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:10.5px;font-weight:700;touch-action:none;cursor:grab}
  .part.gone{visibility:hidden}
  .drag{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 10px 14px #000a)}
  .screw{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#94a3b8 50%,#334155);box-shadow:0 0 0 3px rgba(251,191,36,.7),0 3px 6px #000a;transition:transform .25s}
  .screw::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;margin-top:-1.5px;background:#1e293b;border-radius:2px}
  .screw.ok{transform:translate(-50%,-50%) rotate(270deg) scale(.75);box-shadow:0 2px 4px #000a;pointer-events:none}
  .wall{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;margin:8px 0 12px;border-radius:16px;background:#0b0f1d;box-shadow:inset 0 4px 14px #000a}
  .wall.slide{animation:slide .35s ease-out}@keyframes slide{from{transform:translateX(40px);opacity:0}}
  .tile{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#5b6274,#2f3544);box-shadow:inset 0 2px 0 #ffffff22,inset 0 -3px 0 #0005}
  .tile:nth-child(3n){background:linear-gradient(160deg,#636a7d,#343a4a)}.tile:nth-child(5n){background:linear-gradient(130deg,#4f5567,#2b303e)}
  .tile.v{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 30%,#3a4152),#2b303e 80%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),inset 0 -3px 0 #0005}
  .tile.rich{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 45%,#3a4152),#2b303e 80%);box-shadow:inset 0 0 14px var(--c),inset 0 2px 0 #ffffff22;animation:glow 1.2s infinite alternate}@keyframes glow{to{box-shadow:inset 0 0 22px var(--c),inset 0 2px 0 #ffffff22}}
  .tile svg{pointer-events:none;filter:drop-shadow(0 2px 3px #000a)}
  .tile.done{background:#070a14 !important;box-shadow:inset 0 3px 8px #000;animation:none}

const mineRate=b=>b.rate*bst(b).lvl;
const facTime=b=>b.t/(1+0.4*(bst(b).lvl-1));
const shopPrem=b=>1.12+0.03*bst(b).lvl;
function sellShop(b,units){
  const s=bst(b);let earned=0;
  for(const g of b.goods)while(units>0&&S.stock[g]-s.keep>=1){earned+=price(g)*shopPrem(b);S.stock[g]-=1;sat[g]+=1;units--}
  S.money+=earned;S.xp+=Math.ceil(earned/20);return earned;
}
function tickB(dt){
  const now=Date.now();
  BLD.forEach(b=>{
    const s=bst(b);if(!s.lvl)return;
    if(b.kind!=='shop'){
      s.hp=Math.max(0,s.hp-WEAR*dt);
      if(s.hp<=0){if(!s.warned){s.warned=1;toast('💥 '+b.n+' ist ausgefallen – Wartung nötig!');SFX.crash();vib([60,30,60])}return}
      s.warned=0;
    }
    if(b.kind==='mine')S.stock[b.out]=Math.min(cap(),S.stock[b.out]+mineRate(b)*dt);
    else if(b.kind==='fac'){
      if(s.p<=0&&S.stock[b.out]<cap()&&Object.keys(b.in).every(k=>S.stock[k]>=b.in[k])){for(const k in b.in)S.stock[k]-=b.in[k];s.p=0.001}
      if(s.p>0){s.p+=dt;if(s.p>=facTime(b)){s.p=0;S.stock[b.out]=Math.min(cap(),S.stock[b.out]+1);S.xp+=1}}
    }else{
      s.p+=dt;if(s.p>=SHOPT){s.p=0;sellShop(b,s.lvl)}
      if(!s.nc)s.nc=now+20000;
      if(!s.cust&&now>s.nc){s.cust=now+9000;s.nc=now+25000+Math.random()*30000;SFX.coin();toast('🛎️ Kunde wartet im '+b.n+'!')}

    }
  });
}
function offlineB(dt){
  const m0=S.money,order=['mine','fac','shop'].flatMap(k=>BLD.filter(b=>b.kind===k));let any=false;
  order.forEach(b=>{
    const s=bst(b);if(!s.lvl)return;any=true;
    if(b.kind==='shop'){sellShop(b,Math.floor(dt/SHOPT)*s.lvl);return}
    const t=Math.min(dt,s.hp/WEAR);s.hp=Math.max(0,s.hp-WEAR*dt);
    if(b.kind==='mine'){S.stock[b.out]=Math.min(cap(),S.stock[b.out]+mineRate(b)*t);return}
    let cyc=Math.floor(t/facTime(b));
    for(const k in b.in)cyc=Math.min(cyc,Math.floor(S.stock[k]/b.in[k]));
    cyc=Math.max(0,Math.min(cyc,cap()-Math.floor(S.stock[b.out])));
    for(const k in b.in)S.stock[k]-=b.in[k]*cyc;S.stock[b.out]+=cyc;
  });
  GK.forEach(g=>sat[g]=0);
  if(any)setTimeout(()=>toast('Willkommen zurück! Deine Betriebe haben '+fmt(S.money-m0)+' Credits erwirtschaftet.'),500);
}

function gTiming(rounds=6,title='Abbau',sub='Stoppe den Marker in der grünen Zone. Die Mitte zählt perfekt.',moving=false){return new Promise(res=>{
  const ov=openOv(xbtn()+`<h3>${title}</h3><div class="sub">${sub}</div><div class="dots" id="dots">${'<i></i>'.repeat(rounds)}</div><div class="msg" id="m">Los!</div><div class="track" id="b"><div class="zone" id="z"></div><div class="mark" id="k"></div></div><button class="btn big" id="hit">SCHLAG!</button>`);
  bindX();ov.abort=()=>res(null);
  let pos=0,dir=1,speed=0.9*diff(),zone=0.2,zc=0.5,round=0,pts=0,last=performance.now(),zd=1;
  const newZone=()=>{zc=0.2+Math.random()*0.6;zd=Math.random()<.5?1:-1;$('z').style.left=((zc-zone/2)*100)+'%';$('z').style.width=(zone*100)+'%'};newZone();
  function tick(t){if(!ov.alive)return;const dt=(t-last)/1000;last=t;pos+=dir*speed*dt;
    if(moving){zc+=zd*0.18*dt;const lo=zone/2+.02,hi=1-zone/2-.02;if(zc<lo||zc>hi){zd*=-1;zc=Math.max(lo,Math.min(hi,zc))}$('z').style.left=((zc-zone/2)*100)+'%'}if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}$('k').style.left=(pos*100)+'%';requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  $('hit').onpointerdown=async e=>{

function mTrade(g,buy,e){
  let n=mAmt==='max'?1e9:mAmt,k=0,sum=0;
  if(buy){n=Math.min(n,Math.floor(cap()-S.stock[g]));while(k<n){const p=buyP(g);if(S.money<sum+p)break;sum+=p;sat[g]=Math.max(-45,sat[g]-1);k++}
    if(!k){SFX.err();toast(S.stock[g]>=cap()?'Lager für '+G[g].n+' ist voll':'Nicht genug Credits');return}
    S.money-=sum;S.stock[g]+=k;SFX.buy();fx('+'+k+' '+G[g].n,G[g].c,e.clientX,e.clientY-30)}
  else{n=Math.min(n,Math.floor(S.stock[g]));while(k<n){sum+=sellP(g);sat[g]+=1;k++}
    if(!k){SFX.err();return}
    S.stock[g]-=k;S.money+=sum;S.xp+=Math.ceil(sum/12);SFX.coin();fx('+'+fmt(sum)+' Cr','#fbbf24',e.clientX,e.clientY-30)}
  vib(12);render();
}
let mCat='alle';
function renderMarket(){
  const el=$('s-market'),all=GKU();
  el.innerHTML='<h2>Markt</h2><p class="sub">Direkt handeln: Ankauf 20 % über, Verkauf 25 % unter Marktpreis. Per LKW bekommst du den vollen Preis, am Hafen +60 %.</p>';
  const cats=document.createElement('div');cats.className='cats';
  CATS.filter(([k])=>k==='alle'||all.some(g=>catOf(g)===k)).forEach(([k,n])=>{const b=document.createElement('button');b.className='chip2'+(k===mCat?' on':'');b.textContent=n;b.onclick=()=>{mCat=k;SFX.tick();render()};cats.appendChild(b)});
  el.appendChild(cats);
  const bar=document.createElement('div');bar.className='amt';
  [1,10,50,'max'].forEach(a=>{const b=document.createElement('button');b.className='chip2'+(a===mAmt?' on':'');b.textContent=a==='max'?'Max':'× '+a;b.onclick=()=>{mAmt=a;SFX.tick();render()};bar.appendChild(b)});
  el.appendChild(bar);
  all.filter(g=>mCat==='alle'||catOf(g)===mCat).forEach(g=>{const p=price(g),d=p/G[g].base,c=document.createElement('div');c.className='card';c.style.setProperty('--c',G[g].c);
    const tag=mood[g]>1.8?'<span class="chip up">🔥 BOOM</span>':mood[g]<.6?'<span class="chip dn">❄️ CRASH</span>':'';
    c.innerHTML=`<div class="art">${ic(g,42)}</div><div class="i"><div class="mtop"><span>${G[g].n} ${tag}<small><b class="num" style="font-size:17px;color:var(--ink)">${p.toFixed(2)}</b> · <span class="${d>=1?'up':'dn'}">${d>=1?'▲':'▼'} ${Math.round(Math.abs(d-1)*100)}%</span> · Lager ${Math.floor(S.stock[g])}/${cap()}</small></span>${spark(g)}</div>
      <div class="mrow"><button class="btn b sm" data-a="buy">Kaufen<span class="num">${buyP(g).toFixed(1)} / Stk</span></button><button class="btn sm" data-a="sell" ${S.stock[g]<1?'disabled':''}>Verkaufen<span class="num">${sellP(g).toFixed(1)} / Stk</span></button></div></div>`;
    c.querySelectorAll('.mrow button').forEach(b=>b.onclick=e=>mTrade(g,b.dataset.a==='buy',e));
    el.appendChild(c)});
}
function renderBld(){
  const el=$('s-bld');el.innerHTML='<h2>Betriebe</h2><p class="sub">Baue Minen, Fabriken und Geschäfte aus. Sie arbeiten automatisch – auch wenn du offline bist. Kümmere dich um die Wartung!</p>';
  [['mine','Rohstoffe'],['fac','Fabriken'],['shop','Geschäfte']].forEach(([kind,title])=>{
    const h=document.createElement('div');h.className='sec';h.textContent=title;el.appendChild(h);
    BLD.filter(b=>b.kind===kind).forEach(b=>{
      const s=bst(b),built=s.lvl>0,max=s.lvl>=BMAX,cost=bCost(b),broken=built&&kind!=='shop'&&s.hp<=0;
      const d=document.createElement('div');d.className='card'+(broken?' broken':'')+(built?'':' idle');d.style.setProperty('--c',bc(b));
      let line='';
      if(kind==='mine')line=built?`+${mineRate(b).toFixed(2)}/s ${G[b.out].n}`:`Fördert ${b.rate}/s je Stufe`;
      if(kind==='fac')line=Object.keys(b.in).map(k=>b.in[k]+'× '+G[k].n).join(' + ')+` → 1× ${G[b.out].n} · ${(built?facTime(b):b.t).toFixed(1)}s`;
      if(kind==='shop')line=`Verkauft ${built?s.lvl:1} Stk / ${SHOPT}s · Preis +${Math.round(((built?shopPrem(b):1.15)-1)*100)}%<br>${b.goods.map(g=>G[g].n).join(', ')}`;
      let extra='';
      if(built&&kind!=='shop'){const hc=s.hp>50?'var(--ok)':s.hp>20?'var(--gold)':'var(--bad)';extra+=`<div class="meter" style="height:6px"><i style="width:${s.hp}%;background:${hc}"></i></div><small>${broken?'⚠️ Ausgefallen – Wartung nötig':'Zustand '+Math.round(s.hp)+'%'}</small>`}
      if(built&&kind==='fac'){const t=facTime(b);extra+=`<div class="meter" style="height:6px"><i style="width:${s.p>0?Math.min(100,s.p/t*100):0}%;background:${bc(b)};transition:width 1s linear"></i></div>`}
      d.innerHTML=`<div class="art">${ic(kind==='shop'?'shop':b.out,42)}</div><div class="i">${b.n}${built?' <span class="chip">Lv '+s.lvl+'</span>':''}<small>${line}</small>${extra}<div class="pips">${Array.from({length:BMAX},(_,k)=>`<i class="${k<s.lvl?'on':''}"></i>`).join('')}</div></div><div class="col"></div>`;
      const col=d.querySelector('.col');
      const mk=(t,cls,f,dis)=>{const bt=document.createElement('button');bt.className='btn '+cls;bt.innerHTML=t;bt.disabled=!!dis;bt.onclick=f;col.appendChild(bt)};
      if(s.cust&&s.cust>Date.now())mk('🛎️ Kunde!','a pulse',e=>serveCustomer(b,e));
      if(b.lv&&b.lv>lvl())mk('🔒 Lv '+b.lv,'ghost',null,true);
      else if(!max)mk(built?'⬆ '+fmt(cost):'Bauen '+fmt(cost),built?'b':'',e=>buildOrUpgrade(b,e),S.money<cost);else mk('MAX','ghost',null,true);
      if(built&&kind!=='shop'&&s.hp<85)mk('🔧 Wartung',broken?'r':'ghost',()=>repairB(b));
      if(built&&kind==='shop')mk('Vorrat ≥ '+s.keep,'ghost',()=>{s.keep=KEEPS[(KEEPS.indexOf(s.keep)+1)%KEEPS.length];render()});
      el.appendChild(d);
    });
  });
  renderUpg(el);
}
function renderOrders(){
  const el=$('s-orders'),now=Date.now();
  el.innerHTML=`<h2>Aufträge</h2><p class="sub">Kunden bestellen Ware mit Frist. Pünktlich liefern bringt viel Geld und Ruf, verpasste Fristen kosten Ruf. Die Fristen laufen in Echtzeit.</p>
   <div class="card" style="--c:#fbbf24"><div class="art">${ic('lvl',40)}</div><div class="i">Ruf: ${repTier()} <span class="chip num">${Math.round(S.rep)} / 100</span><div class="meter"><i style="width:${S.rep}%;background:var(--g2)"></i></div><small>Mehr Ruf = höhere Belohnungen und mehr Ladenkunden${S.rep<50?' · VIP-Aufträge ab 50':''}</small></div></div>`;
  const items=o=>Object.keys(o.items).map(g=>`<span class="oi ${S.stock[g]>=o.items[g]?'up':'dn'}">${ic(g,22)}${o.items[g]}× ${G[g].n} <b class="num">(${Math.floor(S.stock[g])})</b></span>`).join('');
  const tag=o=>o.vip?' <span class="chip" style="color:#f0abfc">👑 VIP</span>':o.rush?' <span class="chip dn">⚡ Eilig</span>':'';
  const col=o=>o.vip?'#e879f9':o.rush?'#fb7185':'#22d3ee';
  addSec(el,'Aktiv · '+S.orders.length+' / 3');
  if(!S.orders.length)el.insertAdjacentHTML('beforeend','<p class="sub">Keine aktiven Aufträge. Nimm unten einen an.</p>');
  S.orders.forEach(o=>{const left=o.due-now,f=left/(o.time*1000),d=document.createElement('div');d.className='card';d.style.setProperty('--c',col(o));
    d.innerHTML=`<div class="i">${o.who}${tag(o)}<div class="ois">${items(o)}</div><div class="meter" style="height:6px"><i style="width:${Math.max(0,f*100)}%;background:${f<.25?'var(--g4)':'var(--g1)'}"></i></div><small>⏱ <b class="num">${fmtT(left)}</b> · <b style="color:var(--gold)">${fmt(o.reward)} Cr</b> · +${o.xp} XP</small></div><button class="btn" ${canDeliver(o)?'':'disabled'}>Liefern</button>`;
    d.querySelector('button').onclick=e=>deliverOrder(o,e);el.appendChild(d)});
  addSec(el,'Neue Anfragen');
  if(!S.offers.length)el.insertAdjacentHTML('beforeend','<p class="sub">Gleich kommen neue Anfragen rein …</p>');
  S.offers.forEach(o=>{const d=document.createElement('div');d.className='card';d.style.setProperty('--c',col(o));
    d.innerHTML=`<div class="i">${o.who}${tag(o)}<div class="ois">${items(o)}</div><small>Frist ${Math.round(o.time/60)} min · <b style="color:var(--gold)">${fmt(o.reward)} Cr</b> · +${o.xp} XP · Anfrage läuft ab in ${fmtT(o.exp-now)}</small></div><div class="col"><button class="btn b">Annehmen</button><button class="btn ghost">Ablehnen</button></div>`;
    const [a,x]=d.querySelectorAll('button');a.onclick=()=>acceptOrder(o);x.onclick=()=>{S.offers=S.offers.filter(y=>y!==o);SFX.tick();render()};el.appendChild(d)});
  addSec(el,'Rangliste · Firmenwert');
  const list=[...S.rivals.map(r=>({n:r.n,w:r.w})),{n:'Deine Firma',w:netWorth(),me:1}].sort((a,b)=>b.w-a.w);
  list.forEach((r,i)=>el.insertAdjacentHTML('beforeend',`<div class="rank ${r.me?'me':''}"><b>${i+1}</b><span>${r.n}</span><span class="num">${fmt(Math.round(r.w))} Cr</span></div>`));
}
function renderShop(){
  syncSlots();const el=$('s-shop'),cost=shopCost(),max=shopSlots()>=8,now=Date.now();
  el.innerHTML=`<h2>Dein Laden</h2><p class="sub">Räum Ware in die Regale und setz eigene Preise. Kunden kaufen von allein. Manche wollen feilschen – und pass auf Ladendiebe auf!</p>
   <div class="card" style="--c:#e879f9"><div class="art">${ic('shop',42)}</div><div class="i">Laden Stufe ${S.shop.lvl} <span class="chip">${shopSlots()} Regale</span><small>${S.shop.sold} verkauft · Umsatz ${fmt(S.shop.earned)} Cr · ${S.shop.walked}× ohne Kauf gegangen</small></div><button class="btn a" id="shup" ${max||S.money<cost?'disabled':''}>${max?'MAX':'+ Regal<br>'+fmt(cost)}</button></div>`;
  $('shup').onclick=e=>{if(max||S.money<cost)return;S.money-=cost;S.shop.lvl++;syncSlots();SFX.buy();burst(e.clientX,e.clientY,'#e879f9',16);fx('Neues Regal!','#e879f9');render()};
  if(custQ.length){
    addSec(el,'Kunden im Laden');
    custQ.forEach(c=>{const s=S.shop.slots[c.slot];if(!s||!s.g)return;const d=document.createElement('div');d.className='card'+(c.type==='thief'?' broken':'');
      const f=(c.until-now)/(c.type==='thief'?5000:15000);d.style.setProperty('--c',c.type==='thief'?'#fb7185':'#fbbf24');
      if(c.type==='thief'){d.innerHTML=`<div class="ava" style="background:#111827">🦹</div><div class="i">Ladendieb!<small>Jemand steckt ${G[s.g].n} ein …</small><div class="meter" style="height:5px"><i style="width:${f*100}%;background:var(--g4)"></i></div></div><button class="btn r pulse">Stopp!</button>`;
        d.querySelector('button').onclick=e=>stopThief(c,e)}
      else{const mine=price(s.g)*s.pct/100,off=price(s.g)*c.offer/100;
        d.innerHTML=`<div class="ava" style="background:${nameColor(c.name)}">${c.name[0]}</div><div class="i">${c.name} will feilschen<small>${c.qty}× ${G[s.g].n} für <b style="color:var(--gold)">${off.toFixed(1)}</b> statt ${mine.toFixed(1)} / Stk</small><div class="meter" style="height:5px"><i style="width:${f*100}%;background:var(--g2)"></i></div></div><div class="col"><button class="btn">Deal</button><button class="btn b">Gegen&shy;angebot</button><button class="btn ghost">Nein</button></div>`;
        const [y,k,n]=d.querySelectorAll('button');y.onclick=e=>haggle(c,'yes',e);k.onclick=e=>haggle(c,'counter',e);n.onclick=e=>haggle(c,'no',e)}
      el.appendChild(d)});
  }
  addSec(el,'Regale');
  const grid=document.createElement('div');grid.className='shelves';
  S.shop.slots.slice(0,shopSlots()).forEach((s,i)=>{const b=document.createElement('button');
    if(!s.g){b.className='shelf empty';b.innerHTML='<span style="font-size:26px">+</span><small>Regal befüllen</small>'}
    else{b.className='shelf';b.style.setProperty('--c',G[s.g].c);
      b.innerHTML=`${ic(s.g,40)}<b>${G[s.g].n}</b><small class="num">${s.qty?s.qty+' Stk':'<span class="dn">Ausverkauft</span>'} · ${(price(s.g)*s.pct/100).toFixed(1)} Cr</small><small>${priceLabel(s.pct)} (${s.pct} %)</small>`}
    b.onclick=()=>editSlot(i);grid.appendChild(b)});
  el.appendChild(grid);
}
function renderUpg(el){
  addSec(el,'Ausrüstung');
  UP.forEach(u=>{const d=document.createElement('div'),cost=upCost(u);d.className='card';d.style.setProperty('--c',u.c);
    d.innerHTML=`<div class="art">${ic(u.i,42)}</div><div class="i">${u.n}<small>${u.d}</small><div class="pips">${Array.from({length:10},(_,k)=>`<i class="${k<S.up[u.id]?'on':''}"></i>`).join('')}</div></div><button class="btn a" ${S.money<cost?'disabled':''}>${fmt(cost)}</button>`;
    d.querySelector('button').onclick=e=>{if(S.money>=cost){S.money-=cost;S.up[u.id]++;S.xp+=5;SFX.buy();vib(20);burst(e.clientX,e.clientY,'#fbbf24',14);render()}};el.appendChild(d)});
}
let cur='work',lastLvl=lvl(),shown=S.money;
function render(){
  $('capi').textContent=truckCap();
  const l=lvl(),a=40*(l-1)*(l-1),b=40*l*l;$('lvl').textContent=l;
  $('ringc').style.strokeDashoffset=113.1*(1-Math.max(0,Math.min(1,(S.xp-a)/(b-a))));
  if(l>lastLvl){const was=lastLvl;lastLvl=l;SFX.win();fx('LEVEL '+l,'#22d3ee');
    toast(was<4&&l>=4?'⭐ Level '+l+'! Elektronik freigeschaltet: Baue Smartphones!':'⭐ Level '+l+' erreicht!')}
  if(OV)return;
  ({work:renderWork,farm:renderFarm,bld:renderBld,shop:renderShop,orders:renderOrders,ship:renderShip,market:renderMarket})[cur]();
  if(isTrade(cur))tradeTabs($('s-'+cur));
  badges();
}
(function loop(){shown+=(S.money-shown)*.18;if(Math.abs(S.money-shown)<.5)shown=S.money;$('money').textContent=fmt(Math.floor(shown));requestAnimationFrame(loop)})();
const TRADE=[['market','Markt'],['shop','Laden'],['orders','Aufträge'],['ship','Transport']];
let tradeSub='market';
const isTrade=k=>TRADE.some(t=>t[0]===k);
function go(k){
  cur=k;if(isTrade(k))tradeSub=k;const nk=isTrade(k)?'trade':k;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.s===nk));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+cur));
  document.querySelector('main').scrollTop=0;SFX.tick();render();
}
function tradeTabs(el){
  const d=document.createElement('div');d.className='seg';
  TRADE.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;if(k===cur)b.className='on';
    if((k==='shop'&&custQ.length)||(k==='orders'&&S.orders.some(canDeliver)))b.classList.add('dot');
    b.onclick=()=>go(k);d.appendChild(b)});
  el.prepend(d);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.s==='trade'?tradeSub:b.dataset.s));

/* ===== Hintergrund: Arbeiter, Markt, Events ===== */
let nextEv=Date.now()+40000,histT=0,pressing=false;
addEventListener('pointerdown',()=>pressing=true,true);
addEventListener('pointerup',()=>pressing=false,true);
addEventListener('pointercancel',()=>pressing=false,true);
setInterval(()=>{
  const dt=1;
  tickB(dt);
  GK.forEach(g=>{sat[g]*=Math.exp(-dt/45);mood[g]+=(1-mood[g])*0.01+(Math.random()-0.5)*0.03;mood[g]=Math.max(0.35,mood[g])});
  if((histT+=dt)>=4){histT=0;GK.forEach(g=>{S.hist[g].push(price(g));if(S.hist[g].length>30)S.hist[g].shift()})}
  if(Date.now()>nextEv){nextEv=Date.now()+50000+Math.random()*50000;
    const gl=GKU(),g=gl[Math.floor(Math.random()*gl.length)],up=Math.random()<0.6;mood[g]=up?2.2:0.45;setTimeout(()=>mood[g]=1,35000);
    const rv=pick(S.rivals).n;
    toast(up?`🔥 ${rv} kauft ${G[g].n} auf – 35 s lang hohe Preise!`:`❄️ ${rv} überschwemmt den Markt mit ${G[g].n} – Preissturz!`);SFX.coin()}
  tickOrders();tickShop(dt);tickRivals(dt);tickFarm(dt);
  if(!OV&&!pressing&&cur!=='ship'&&cur!=='work')render();else badges();
  S.last=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}
},1000);
render();
toast('Starte in der Werkstatt: baue Eisenerz ab!');
</script>
