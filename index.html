<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Industry Action</title>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">Industry<small>ACTION</small></div>
    <button class="iconbtn" id="snd" aria-label="Ton">🔊</button>
  </div>
  <div class="hud">
    <div class="pill"><svg width="30" height="30"><use href="#i-coin"/></svg><div><b class="num" id="money">0</b><span>Credits</span></div></div>
    <div class="pill" id="lvpill" style="flex:0 0 auto;cursor:pointer"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle id="ringc" cx="22" cy="22" r="18" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="transition:stroke-dashoffset .5s"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs></svg><b id="lvl">1</b></div><div><b style="font-size:13px">Level</b><span>Fabrik</span></div></div>
    <div class="pill" style="flex:0 0 auto"><svg width="30" height="30"><use href="#i-truck"/></svg><div><b class="num" id="capi">20</b><span>Laderaum</span></div></div>
  </div>
</header>

<main>
  <section class="screen on" id="s-work"></section>
  <section class="screen" id="s-farm"></section>
  <section class="screen" id="s-bld"></section>
  <section class="screen" id="s-shop"></section>
  <section class="screen" id="s-orders"></section>
  <section class="screen" id="s-market"></section>
  <section class="screen" id="s-logistics"></section>
  <section class="screen" id="s-under"></section>
</main>

<nav id="nav">
  <button class="on" data-s="work"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Werkstatt</button>
  <button data-s="farm"><svg viewBox="0 0 24 24"><path d="M12 21v-9M12 12c0-4 3-7 7-7 0 4-3 7-7 7zM12 15c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5zM5 21h14"/></svg>Farm</button>
  <button data-s="bld"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l5-3v15M10 21V12l5-3v12M15 21V4h4v17"/></svg>Betriebe</button>
  <button data-s="trade"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 13v8h14v-8M10 21v-5h4v5"/></svg>Handel</button>
  <button data-s="under"><svg viewBox="0 0 24 24"><path d="M3 10c3-3 15-3 18 0l-1 4c-2 3-5 3-6 1l-2-2-2 2c-1 2-4 2-6-1z"/><circle cx="8" cy="11.5" r="1.2"/><circle cx="16" cy="11.5" r="1.2"/></svg>Untergrund</button>
</nav>
<div id="ov"><div id="ovbox"></div></div>
<div id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
