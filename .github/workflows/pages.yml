# Baut das Spiel bei jedem Push und veröffentlicht dist/ auf GitHub Pages.
# Einmalig nötig: Repo-Einstellungen → Pages → Source: „GitHub Actions“.
# Sicherheit: Actions sind auf feste Commits gepinnt (Tag als Kommentar), jeder Job hat nur die Rechte, die er braucht,
# und der Workflow läuft nur bei Pushes ins Repo – nie für Pull Requests von Fremden.
name: Spiel veröffentlichen

on:
  push:
    branches: [ccr-8ff9a5bb-sl6m40, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
